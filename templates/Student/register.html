{% extends "Layouts/student_base.html" %}
{% block title %}Student Registration{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm mt-5 border-0">
            <div class="card-body p-5">
                <h3 class="card-title text-center mb-4 fw-bold">Create Your Account</h3>
                <form method="POST" action="{{ url_for('auth.register') }}">
                    <div class="mb-3">
                        <label class="form-label text-muted fw-bold">Username</label>
                        <input type="text" name="username" class="form-control bg-light" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-muted fw-bold">Password</label>
                        <input type="password" name="password" class="form-control bg-light" required>
                    </div>
                    <div class="row mt-4">
                        <div class="col-md-6 mb-3">
                            <label class="form-label text-muted fw-bold">Gender</label>
                            <select name="gender" class="form-select bg-light">
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Prefer not to say" selected>Prefer not to say</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-4">
                            <label class="form-label text-muted fw-bold">Year of Study</label>
                            <select name="year_of_study" class="form-select bg-light">
                                <option value="Freshman">Freshman</option>
                                <option value="Sophomore">Sophomore</option>
                                <option value="Junior">Junior</option>
                                <option value="Senior">Senior</option>
                                <option value="Prefer not to say" selected>Prefer not to say</option>
                            </select>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-success btn-lg w-100 shadow-sm">Create Account</button>
                </form>
                <div class="mt-4 text-center">
                    <span class="text-muted">Already have an account?</span> 
                    <a href="{{ url_for('auth.login') }}" class="text-decoration-none fw-bold">Login here</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
