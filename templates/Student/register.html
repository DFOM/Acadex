{% extends "Layouts/student_base.html" %}
{% block title %}Student Registration{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm mt-5 border-0 ax-card">
            <div class="card-body p-5">
                <h3 class="card-title text-center mb-4 fw-bold">Create Your Account</h3>
                <form method="POST" action="{{ url_for('auth.register') }}">
                    <div class="mb-3">
                        <label class="form-label text-muted fw-bold">Username</label>
                        <input type="text" name="username" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-muted fw-bold">Email</label>
                        <input type="email" name="email" class="form-control" placeholder="you@example.edu" required>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label text-muted fw-bold">Password</label>
                            <input type="password" name="password" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label text-muted fw-bold">Confirm Password</label>
                            <input type="password" name="confirm_password" class="form-control" required>
                        </div>
                    </div>

                    <div class="row mt-2">
                        <div class="col-md-6 mb-3">
                            <label class="form-label text-muted fw-bold">Gender</label>
                            <select name="gender" class="form-select">
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Prefer not to say" selected>Prefer not to say</option>
                            </select>
                        </div>
                        
                        <div class="col-md-6 mb-3">
                            <label class="form-label text-muted fw-bold">Expected Graduation</label>
                            <select name="expected_graduation" class="form-select">
                                <option value="" selected>Select Year</option>
                                <option value="2026">2026</option>
                                <option value="2027">2027</option>
                                <option value="2028">2028</option>
                                <option value="2029">2029</option>
                                <option value="2030">2030</option>
                                <option value="2031">2031</option>
                            </select>
                        </div>
                    </div>

                    <div class="row mt-2">
                        <div class="col-md-6 mb-3">
                            <label class="form-label text-muted fw-bold">Major</label>
                            <select name="major_subject_area_id" class="form-select" required>
                                <option value="" selected disabled>Select Major</option>
                                {% for major in majors %}
                                    <option value="{{ major.id }}">{{ major.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label text-muted fw-bold">Minor</label>
                            <select name="minor_subject_area_id" class="form-select" required>
                                <option value="" selected disabled>Select Minor</option>
                                {% for minor in minors %}
                                    <option value="{{ minor.id }}">{{ minor.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-success btn-lg w-100 shadow-sm">Create Account</button>
                </form>
                <div class="mt-4 text-center">
                    <span class="text-muted">Already have an account?</span> 
                    <a href="{{ url_for('auth.login') }}" class="text-decoration-none fw-bold">Login here</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
