{% extends "Layouts/student_base.html" %}
{% block title %}My Profile{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-sm border-0 ax-card mt-3">
            <div class="card-body p-4">
                <h3 class="fw-bold mb-4">Profile</h3>
                <form method="POST" enctype="multipart/form-data">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold text-muted">Name</label>
                            <input class="form-control" name="full_name" value="{{ current_user.full_name or '' }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold text-muted">Email</label>
                            <input class="form-control" type="email" name="email" value="{{ current_user.email or '' }}" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold text-muted">Profile Image (optional)</label>
                        <input class="form-control" type="file" name="profile_image" accept=".png,.jpg,.jpeg,.webp,.gif">
                        {% if current_user.profile_image_path %}
                        <div class="small text-muted mt-1">Current: {{ current_user.profile_image_path }}</div>
                        {% endif %}
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold text-muted">Major</label>
                            <select name="major_subject_area_id" class="form-select" required>
                                <option value="" disabled>Select Major</option>
                                {% for major in majors %}
                                <option value="{{ major.id }}" {% if current_user.major_subject_area_id == major.id %}selected{% endif %}>{{ major.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold text-muted">Minor</label>
                            <select name="minor_subject_area_id" class="form-select" required>
                                <option value="" disabled>Select Minor</option>
                                {% for minor in minors %}
                                <option value="{{ minor.id }}" {% if current_user.minor_subject_area_id == minor.id %}selected{% endif %}>{{ minor.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold text-muted">Gender</label>
                            <select name="gender" class="form-select">
                                <option value="">Prefer not to say</option>
                                <option value="Male" {% if current_user.gender == 'Male' %}selected{% endif %}>Male</option>
                                <option value="Female" {% if current_user.gender == 'Female' %}selected{% endif %}>Female</option>
                                <option value="Prefer not to say" {% if current_user.gender == 'Prefer not to say' %}selected{% endif %}>Prefer not to say</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold text-muted">Career Interests</label>
                            <input class="form-control" name="career_interests" value="{{ current_user.career_interests or '' }}">
                        </div>
                    </div>

                    <hr>
                    <h5 class="fw-bold mb-3">Change Password</h5>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label text-muted">Old Password</label>
                            <input class="form-control" type="password" name="old_password">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label text-muted">New Password</label>
                            <input class="form-control" type="password" name="new_password">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label text-muted">Confirm New Password</label>
                            <input class="form-control" type="password" name="confirm_new_password">
                        </div>
                    </div>

                    <button class="btn btn-primary" type="submit">Save Profile</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
