{% extends "Layouts/student_base.html" %}
{% block title %}UI Preferences{% endblock %}

{% block content %}
<div class="row justify-content-center mt-3">
    <div class="col-lg-8">
        <div class="card shadow-sm border-0 ax-card">
            <div class="card-body p-4">
                <h3 class="fw-bold mb-2">UI Preferences</h3>
                <p class="text-muted mb-4">Use the Theme button in the top navigation to switch between light and dark modes.</p>
                <div class="alert alert-info mb-0" role="alert">
                    Your theme preference is saved automatically on this device.
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
