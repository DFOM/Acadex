{% extends "Layouts/student_base.html" %}
{% block title %}Student Login{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm mt-5 border-0 ax-card">
            <div class="card-body p-5">
                <h3 class="card-title text-center mb-4 fw-bold">Student Login</h3>
                <form method="POST" action="{{ url_for('auth.login') }}">
                    <div class="mb-3">
                        <label class="form-label text-muted fw-bold">Email or Username</label>
                        <input type="text" name="username" class="form-control form-control-lg" required autofocus>
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-muted fw-bold">Password</label>
                        <input type="password" name="password" class="form-control form-control-lg" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg w-100 shadow-sm">Login to Portal</button>
                </form>
                <div class="mt-4 text-center">
                    <span class="text-muted">Don't have an account?</span> 
                    <a href="{{ url_for('auth.register') }}" class="text-decoration-none fw-bold">Register here</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
