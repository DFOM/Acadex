{% extends "Layouts/admin_base.html" %}
{% block title %}Registration Fields{% endblock %}

{% block content %}
<h2 class="mb-4">Registration Fields</h2>

<div class="card shadow-sm mb-4">
    <div class="card-body">
        <h5 class="mb-3">Add Field</h5>
        <form method="POST" action="{{ url_for('admin.manage_registration_fields') }}" class="row g-2">
            <input type="hidden" name="action" value="create">
            <div class="col-md-2"><input class="form-control" name="field_key" placeholder="field_key" required></div>
            <div class="col-md-2"><input class="form-control" name="label" placeholder="Label" required></div>
            <div class="col-md-2">
                <select class="form-select" name="input_type">
                    <option value="text">Text</option>
                    <option value="textarea">Textarea</option>
                    <option value="select">Select</option>
                </select>
            </div>
            <div class="col-md-3"><input class="form-control" name="options_csv" placeholder="Option A, Option B"></div>
            <div class="col-md-1"><input class="form-control" name="display_order" type="number" value="0"></div>
            <div class="col-md-2 d-flex align-items-center gap-3">
                <label class="form-check m-0"><input class="form-check-input" type="checkbox" name="is_required"> Required</label>
                <label class="form-check m-0"><input class="form-check-input" type="checkbox" name="is_active" checked> Active</label>
            </div>
            <div class="col-12"><button class="btn btn-primary" type="submit">Create Field</button></div>
        </form>
    </div>
</div>

{% for field in fields %}
<div class="card shadow-sm mb-3">
    <div class="card-body">
        <form method="POST" action="{{ url_for('admin.manage_registration_fields') }}" class="row g-2 align-items-center">
            <input type="hidden" name="action" value="update">
            <input type="hidden" name="field_id" value="{{ field.id }}">
            <div class="col-md-2"><input class="form-control" value="{{ field.field_key }}" disabled></div>
            <div class="col-md-2"><input class="form-control" name="label" value="{{ field.label }}"></div>
            <div class="col-md-2">
                <select class="form-select" name="input_type">
                    <option value="text" {% if field.input_type == 'text' %}selected{% endif %}>Text</option>
                    <option value="textarea" {% if field.input_type == 'textarea' %}selected{% endif %}>Textarea</option>
                    <option value="select" {% if field.input_type == 'select' %}selected{% endif %}>Select</option>
                </select>
            </div>
            <div class="col-md-3"><input class="form-control" name="options_csv" value="{{ (field.options_json or '[]') | replace('[','') | replace(']','') | replace('"','') }}"></div>
            <div class="col-md-1"><input class="form-control" type="number" name="display_order" value="{{ field.display_order }}"></div>
            <div class="col-md-2 d-flex align-items-center gap-3">
                <label class="form-check m-0"><input class="form-check-input" type="checkbox" name="is_required" {% if field.is_required %}checked{% endif %}> Required</label>
                <label class="form-check m-0"><input class="form-check-input" type="checkbox" name="is_active" {% if field.is_active %}checked{% endif %}> Active</label>
            </div>
            <div class="col-12">
                <button class="btn btn-success btn-sm" type="submit">Save</button>
            </div>
        </form>
        {% if field.field_key not in ['gender', 'career_interests'] %}
        <form method="POST" action="{{ url_for('admin.manage_registration_fields') }}" class="mt-2">
            <input type="hidden" name="action" value="delete">
            <input type="hidden" name="field_id" value="{{ field.id }}">
            <button class="btn btn-outline-danger btn-sm" type="submit">Delete</button>
        </form>
        {% endif %}
            </div>
    </div>
</div>
{% endfor %}
{% endblock %}
